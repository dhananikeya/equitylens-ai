name: Validate local deep research data

on:
  workflow_dispatch:
  push:
    paths:
      - "data/generated_company_metrics.json"
      - "data/generated_company_quarterly.json"
      - "data/generated_company_analysis.json"
      - "data/generated_company_s1.json"
      - "data/research_pipeline_state.json"
      - "data/research_coverage.json"
      - "data/research_index.json"
      - ".github/workflows/build-deep-research.yml"

permissions:
  contents: read

jobs:
  validate-generated-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              "data/generated_company_metrics.json",
              "data/generated_company_quarterly.json",
              "data/generated_company_analysis.json",
              "data/generated_company_s1.json",
              "data/research_pipeline_state.json",
              "data/research_coverage.json",
              "data/research_index.json",
          ]

          counts = {}
          for filename in files:
              path = Path(filename)
              with path.open("r", encoding="utf-8") as handle:
                  payload = json.load(handle)
              if not isinstance(payload, dict):
                  raise TypeError(f"{filename} must contain a JSON object")
              counts[filename] = len(payload)
              print(f"{filename}: {len(payload)} top-level records")

          qualitative = counts["data/generated_company_analysis.json"]
          registration = counts["data/generated_company_s1.json"]

          if qualitative == 0:
              print(
                  "::warning::Generated qualitative research is empty. "
                  "Run scripts/build_deep_research.py from a machine that can reach the configured local LLM."
              )
          if registration == 0:
              print(
                  "::warning::Generated registration research is empty. "
                  "This workflow validates local-LLM artifacts but does not create them."
              )

          print("Local research artifacts and coverage indexes are valid.")
          PY
