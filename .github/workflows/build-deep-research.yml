name: Validate local deep research data

on:
  workflow_dispatch:
  push:
    paths:
      - "data/generated_company_metrics.json"
      - "data/generated_company_quarterly.json"
      - "data/generated_company_analysis.json"
      - "data/generated_company_s1.json"
      - "data/research_pipeline_state.json"
      - ".github/workflows/build-deep-research.yml"

permissions:
  contents: read

jobs:
  validate-generated-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              "data/generated_company_metrics.json",
              "data/generated_company_quarterly.json",
              "data/generated_company_analysis.json",
              "data/generated_company_s1.json",
              "data/research_pipeline_state.json",
          ]

          for filename in files:
              path = Path(filename)
              with path.open("r", encoding="utf-8") as handle:
                  payload = json.load(handle)
              if not isinstance(payload, dict):
                  raise TypeError(f"{filename} must contain a JSON object")
              print(f"{filename}: {len(payload)} records")

          print("Generated local-LLM research data is valid.")
          PY
