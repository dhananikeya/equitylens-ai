name: Check research UX changes

on:
  pull_request:
    paths:
      - "app.py"
      - "research_experience.py"
      - "requirements.txt"
      - "tests/test_research_experience.py"
      - ".github/workflows/check-research-ux.yml"
  push:
    branches:
      - "feature/free-research-ux"
    paths:
      - "app.py"
      - "research_experience.py"
      - "requirements.txt"
      - "tests/test_research_experience.py"
      - ".github/workflows/check-research-ux.yml"

permissions:
  contents: read

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF export dependency
        run: python -m pip install reportlab
      - name: Check Python compilation
        run: python -m compileall -q app.py research_experience.py tests
      - name: Test research experience
        run: python -m unittest discover -s tests -p "test_research_experience.py" -v
