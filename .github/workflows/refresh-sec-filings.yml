name: Refresh SEC filings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_sec_filings.py"
      - ".github/workflows/refresh-sec-filings.yml"

permissions:
  contents: write

concurrency:
  group: equitylens-sec-refresh
  cancel-in-progress: false

jobs:
  refresh-sec-filings:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh SEC filing feed
        run: python scripts/update_sec_filings.py

      - name: Commit new SEC filings
        run: |
          if git diff --quiet -- data/sec_filings.json; then
            echo "No new SEC filings."
            exit 0
          fi

          git config user.name "EquityLens SEC Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sec_filings.json
          git commit -m "Auto-update SEC filing feed"
          git push
