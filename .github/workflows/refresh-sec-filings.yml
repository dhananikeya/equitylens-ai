name: Refresh SEC filings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_sec_filings.py"
      - "data/finviz_universe.csv"
      - ".github/workflows/refresh-sec-filings.yml"

permissions:
  contents: write

concurrency:
  group: equitylens-sec-refresh
  cancel-in-progress: false

jobs:
  refresh-sec-filings:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh SEC filing feed
        run: python -u scripts/update_sec_filings.py

      - name: Commit new SEC filings
        run: |
          if [ -z "$(git status --porcelain -- data/sec_filings.json data/sec_filings.json.gz data/sec_summary.json data/sec_companies)" ]; then
            echo "No SEC filing, archive, summary, or company-shard changes."
            exit 0
          fi

          git config user.name "EquityLens SEC Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/sec_filings.json data/sec_filings.json.gz data/sec_summary.json data/sec_companies
          git commit -m "Auto-update SEC filing feed"
          git pull --rebase origin main
          git push origin HEAD:main
