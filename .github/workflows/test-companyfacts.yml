name: Test SEC companyfacts normalization

on:
  pull_request:
    paths:
      - "scripts/update_companyfacts_metrics.py"
      - "tests/test_companyfacts_metrics.py"
      - ".github/workflows/test-companyfacts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python scripts
        run: python -m py_compile scripts/update_companyfacts_metrics.py
      - name: Run offline SEC normalization tests
        run: python -m unittest discover -s tests -p "test_companyfacts_metrics.py" -v
